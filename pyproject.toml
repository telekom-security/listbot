[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listbot"
version = "0.1.0"
description = "Generate IP reputation and CVE translation maps."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2",
    "rich>=14",
]

[project.scripts]
listbot = "listbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/listbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
